[package]
name = "cabbot"
version = "0.2.0"
edition = "2024"
rust-version = "1.88"

[dependencies]
chrono = "0.4.45"
colored = "3.1.1"
dotenvy = "0.15.7"
fern = "0.7.1"
log = "0.4.35"
serde = "1.0.229"
serde_json = "1.0.154"
serenity = { version = "0.12.5", features = ["cache"] }
tokio = { version = "1.54.1", features = ["macros", "rt-multi-thread"]}
